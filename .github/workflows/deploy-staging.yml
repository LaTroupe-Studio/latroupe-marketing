name: Deploy staging environment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  STAGING_BUCKET: staging-latroupestudio-com
  STAGING_DISTRIBUTION_ID: E3GBTTC8YJUCG1
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AWS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"

      - name: Create extensionless aliases (es/* and en/*)
        run: |
          set -euo pipefail
          shopt -s nullglob
          # CloudFront/S3 está sirviendo como ficheros (p.ej. /es.html),
          # así que generamos también los "aliases" sin extensión.
          for f in out/es/*.html; do
            cp "$f" "${f%.html}"
          done
          for f in out/en/*.html; do
            cp "$f" "${f%.html}"
          done

      - name: Configure AWS credentials (LaTroupe account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 (staging)
        run: aws s3 sync out/ "s3://${STAGING_BUCKET}/" --delete

      - name: Create extensionless aliases (root /es and /en)
        run: |
          set -euo pipefail
          aws s3api put-object \
            --bucket "${STAGING_BUCKET}" \
            --key "es" \
            --body out/es.html \
            --content-type "text/html; charset=utf-8"

          aws s3api put-object \
            --bucket "${STAGING_BUCKET}" \
            --key "en" \
            --body out/en.html \
            --content-type "text/html; charset=utf-8"

      - name: Create extensionless aliases (nested pages with correct content-type)
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in out/es/*.html; do
            name="$(basename "${f%.html}")"
            aws s3api put-object \
              --bucket "${STAGING_BUCKET}" \
              --key "es/${name}" \
              --body "$f" \
              --content-type "text/html; charset=utf-8"
          done

          for f in out/en/*.html; do
            name="$(basename "${f%.html}")"
            aws s3api put-object \
              --bucket "${STAGING_BUCKET}" \
              --key "en/${name}" \
              --body "$f" \
              --content-type "text/html; charset=utf-8"
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${STAGING_DISTRIBUTION_ID}" \
            --paths "/*" "/index.html"
